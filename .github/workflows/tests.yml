name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      browsers:
        description: "Comma-separated browsers to run (chromium, firefox)"
        required: false
        default: "chromium,firefox"

jobs:
  test:
    name: Test (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser (${{ matrix.browser }})
        run: playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests
        run: pytest --browser ${{ matrix.browser }} -v
        # No continue-on-error here: a real failure must turn this job red.
        # The report job below still runs regardless (if: always()), so a
        # failed browser doesn't block the Allure report from being
        # generated and deployed -- it just also gets reported as failed,
        # instead of silently passing.

      - name: Upload Allure results (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results
          retention-days: 20

  report:
    name: Generate & deploy Allure report
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to push the generated report to the gh-pages branch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Set up Java (required by the Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Load previous report history (for the trend chart)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Carry over Allure history from the previous report
        run: |
          if [ -d gh-pages/history ]; then
            mkdir -p allure-results/history
            cp -r gh-pages/history/. allure-results/history/
          fi

      - name: Install Allure commandline
        run: npm install -g allure-commandline@2.43.0

      - name: Generate Allure report
        run: allure generate allure-results --clean -o allure-report

      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PAGES_URL: https://andriygvozd.github.io/AutoEx-PlayWright-pytest/
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL secret is not set -- skipping Slack notification."
            exit 0
          fi

          PASSED=$(jq -r '.statistic.passed' allure-report/widgets/summary.json)
          FAILED=$(jq -r '.statistic.failed' allure-report/widgets/summary.json)
          BROKEN=$(jq -r '.statistic.broken' allure-report/widgets/summary.json)
          TOTAL=$(jq -r '.statistic.total' allure-report/widgets/summary.json)

          if [ "$FAILED" -eq 0 ] && [ "$BROKEN" -eq 0 ]; then
            EMOJI=":white_check_mark:"
            STATUS_TEXT="All tests passed"
          else
            EMOJI=":x:"
            STATUS_TEXT="Some tests failed"
          fi

          PAYLOAD=$(jq -n \
            --arg emoji "$EMOJI" \
            --arg status_text "$STATUS_TEXT" \
            --arg passed "$PASSED" \
            --arg failed "$FAILED" \
            --arg broken "$BROKEN" \
            --arg total "$TOTAL" \
            --arg branch "$BRANCH" \
            --arg commit_msg "${COMMIT_MSG%%$'\n'*}" \
            --arg run_url "$RUN_URL" \
            --arg pages_url "$PAGES_URL" \
            '{
              blocks: [
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: "\($emoji) *\($status_text)* — \($passed)/\($total) passed (\($failed) failed, \($broken) broken)\n*Branch:* `\($branch)`\n*Commit:* \($commit_msg)"
                  }
                },
                {
                  type: "actions",
                  elements: [
                    { type: "button", text: { type: "plain_text", text: "View Allure Report" }, url: $pages_url, style: "primary" },
                    { type: "button", text: { type: "plain_text", text: "View CI Run" }, url: $run_url }
                  ]
                }
              ]
            }')

          curl -sf -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
