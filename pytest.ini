[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --tracing retain-on-failure --screenshot only-on-failure --video retain-on-failure --alluredir=allure-results --clean-alluredir
; Browser and parallelism are chosen per-run via CLI, not hardcoded here:
;   --browser chromium|firefox|webkit  (repeatable to run on several browsers; defaults to chromium alone)
;     Note: Playwright has no separate "Safari" browser to select -- WebKit
;     is the actual engine Playwright uses to automate Safari, so
;     `--browser webkit` is how you run the suite "on Safari".
;   -n auto | -n <N>                   (pytest-xdist; distributes tests across N worker processes)
; Examples:
;   pytest -n 4 --browser firefox
;   pytest --browser webkit   ; Safari
