[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --tracing retain-on-failure --screenshot only-on-failure --video retain-on-failure --alluredir=allure-results --clean-alluredir --reruns 3 --reruns-delay 2 --only-rerun "TimeoutError|AssertionError"
; Failed tests are retried up to 3 times (2s apart) before being reported as
; failed. This is aimed at the live site's own load-related flakiness (slow
; AJAX, an occasional dropped request), not at masking real bugs -- reruns
; are limited to Playwright timeouts and assertion failures via
; --only-rerun, so a genuine crash (e.g. an import/syntax error) still fails
; immediately without wasting 3 attempts on it.
; Browser and parallelism are chosen per-run via CLI, not hardcoded here:
;   --browser chromium|firefox|webkit  (repeatable to run on several browsers; defaults to chromium alone)
;     Note: Playwright has no separate "Safari" browser to select -- WebKit
;     is the actual engine Playwright uses to automate Safari, so
;     `--browser webkit` is how you run the suite "on Safari".
;   -n auto | -n <N>                   (pytest-xdist; distributes tests across N worker processes)
; Examples:
;   pytest -n 4 --browser firefox
;   pytest --browser webkit   ; Safari
