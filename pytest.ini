[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --base-url https://automationexercise.com --tracing retain-on-failure --screenshot only-on-failure --video retain-on-failure --alluredir=allure-results --clean-alluredir --reruns 3 --reruns-delay 2 --only-rerun "TimeoutError|AssertionError"
; Failed tests are retried up to 3 times (2s apart) before being reported as
; failed. This is aimed at the live site's own load-related flakiness (slow
; AJAX, an occasional dropped request), not at masking real bugs -- reruns
; are limited to Playwright timeouts and assertion failures via
; --only-rerun, so a genuine crash (e.g. an import/syntax error) still fails
; immediately without wasting 3 attempts on it.
; Browser, base URL and parallelism are chosen per-run via CLI, not hardcoded
; in source (pages/base_page.py has no URL constant -- it's injected via the
; pytest-playwright `base_url` fixture, defaulted here so the suite still
; runs unchanged with a bare `pytest`):
;   --browser chromium|firefox  (repeatable to run on several browsers; defaults to chromium alone)
;   --base-url <url>            (point the suite at a different environment, e.g. a staging mirror)
;   -n auto | -n <N>            (pytest-xdist; distributes tests across N worker processes)
; Example:
;   pytest -n 4 --browser firefox --base-url https://staging.automationexercise.com
